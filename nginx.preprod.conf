# HTTP server block: serve ACME challenges and redirect all other traffic to HTTPS
server {
    listen 80;
    server_name preprod-CHANGEME.example.com;

    # Serve ACME challenge files for Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block: SSL configuration and reverse proxy setup
server {
    listen 443 ssl;
    server_name preprod-CHANGEME.example.com;

    # SSL certificate configuration - update these paths as needed
    ssl_certificate /etc/letsencrypt/live/preprod-CHANGEME.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preprod-CHANGEME.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Serve static files from Django
    location /static/ {
        alias /staticfiles/;  # This path must match where you mount your staticfiles
        expires 30d;
        add_header Cache-Control "public";
    }
    # For pgadmin
    location ^~ /pgadmin {
        proxy_pass http://pgadmin:80/pgadmin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # For the Django backend (API and admin)
    location /api/ {
        proxy_pass http://streetfinder-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
    location /admin/ {
        proxy_pass http://streetfinder-backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # For the frontend
    location / {
        proxy_pass http://streetfinder-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
