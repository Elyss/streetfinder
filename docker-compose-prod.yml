services:
  reverse-proxy:
    image: caddy:2
    container_name: streetfinder-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=delay-lama.fr
      # Redirected to DOMAIN (elyss.fr: former domain, kept temporarily)
      - REDIRECT_FROM=www.delay-lama.fr, elyss.fr
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # Certificates, must persist across restarts
      - caddy_config:/config
      - ./staticfiles:/staticfiles:ro
      - ./media:/media:ro
    depends_on:
      - frontend
      - backend

  backend:
    image: elyssfr/streetfinder-backend:latest
    container_name: streetfinder-backend
    volumes:
      - ./staticfiles:/app/staticfiles  # So that /app/staticfiles in the container is synced to ./staticfiles on the host
      - ./media:/app/media  # Board images uploaded by users, served by Caddy
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=delay-lama.fr
      - FRONTEND_URL=https://delay-lama.fr
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env

  frontend:
    image: elyssfr/streetfinder-frontend:latest
    container_name: streetfinder-frontend
    expose:
      - "80"

  db:
    image: postgres:17
    container_name: streetfinder-db
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streetfinder-redis

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: streetfinder-pgadmin
    env_file: .env
    environment:
      - PGADMIN_CONFIG_SERVER_MODE=True
      - SCRIPT_NAME=/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin_data:
  caddy_data:
  caddy_config:
