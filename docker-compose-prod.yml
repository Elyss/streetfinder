services:
  reverse-proxy:
    image: elyssfr/streetfinder-reverse-proxy:latest
    container_name: streetfinder-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./staticfiles:/staticfiles:ro
    depends_on:
      - frontend
      - backend

  backend:
    image: elyssfr/streetfinder-backend:latest
    container_name: streetfinder-backend
    volumes:
      - ./staticfiles:/app/staticfiles  # So that /app/staticfiles in the container is synced to ./staticfiles on the host
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=elyss.fr
      - FRONTEND_URL=https://elyss.fr
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  frontend:
    image: elyssfr/streetfinder-frontend:latest
    container_name: streetfinder-frontend
    expose:
      - "80"

  db:
    image: postgres:17
    container_name: streetfinder-db
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: streetfinder-pgadmin
    env_file: .env
    environment:
      - PGADMIN_CONFIG_SERVER_MODE=True
      - SCRIPT_NAME=/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin_data:
